# 标定采集与手眼标定专用配置（capture / calibrate_camera / calibrate_handeye / calibrate_robotworld_handeye）
# 相机块与 standard3.yaml 保持同步；内参来自 2026-10-11 手眼同批实拍标定（calibrate_camera，96 张取 75）

#####-----相机（大恒 Galaxy MER-139-210U3C）-----#####
camera_name: "galaxy"
galaxy:
  sn: "KE0210030288"        # 留空则按 index 打开
  index: 1
  # 几何参数必须写全！相机设置会跨开关机保留（实测），不写会沿用上次遗留的 ROI
  roi_width: 1280
  roi_height: 1024
  roi_x: 0
  roi_y: 0
  decimation: 1
  exposure_us: 10000        # 手眼采集时云台动得快会有运动模糊 → 可调小（如 3000）再采
  gain_db: 0
  framerate: 210
  pixel_format: "BayerRG8"  # 满帧率必须 8bit
  balance_white_auto: "Once"

#####-----棋盘格（打印板：12×9 方格、格距 30mm）-----#####
# pattern_* 是"内角点"数（OpenCV patternSize 语义）。实测实证（2026-10-11 暗场地实拍）：
# 本板为 11×8 个内角点（= 12×9 个方格）——曾按"11×8 方格 → 10×7 内角点"配置，
# 结果 SB 全尺寸全失败；改 11/8 后稳定检出（12×9、13×10 等更大尺寸均拒识，排除歧义）。
# 自证方法：capture 画面叠加显示 board OK 即语义正确；全 failure 先怀疑这里。
pattern_cols: 11
pattern_rows: 8
center_distance_mm: 30

#####-----相机内参（2026-10-11 实拍标定，96 张识别 75，mean 0.108 / rms 0.123px）-----#####
# 旧值留档（2026-08-15，rms 0.098px）：fx 1292.4613 fy 1292.1487 cx 651.550 cy 485.413
# 前值留档（2026-10-11 首轮 45 张识别 35，rms 0.129px）：fx 1281.2886 fy 1281.3023 cx 647.7272 cy 508.8639
camera_matrix: [1282.53324435994, 0, 647.4986327469708, 0, 1282.229787675208, 511.5407319264762, 0, 0, 1]
distort_coeffs: [-0.07386963879816996, 0.09753513916562999, 0.0001865833496305231, 0.0003022888766735818, 0.09264600795890895]

#####-----手眼-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]   # 云台→IMU 体轴；IMU 接入前单位阵

#####-----串口（下位机 io::Gimbal，协议见 docs/serial-protocol.md）-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200
first_q_timeout_s: 3      # 标定场景给 3s：下位机不在 3s 内报错退出（capture --no-q 可完全跳过）
