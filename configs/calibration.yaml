# 标定采集与手眼标定专用配置（capture / calibrate_handeye / calibrate_robotworld_handeye）
# 相机块与 standard3.yaml 保持同步；内参来自 2026-08-15 棋盘标定（calibration/mer1_camera_params.yaml）

#####-----相机（大恒 Galaxy MER-139-210U3C）-----#####
camera_name: "galaxy"
galaxy:
  sn: "KE0210030288"        # 留空则按 index 打开
  index: 1
  # 几何参数必须写全！相机设置会跨开关机保留（实测），不写会沿用上次遗留的 ROI
  roi_width: 1280
  roi_height: 1024
  roi_x: 0
  roi_y: 0
  decimation: 1
  exposure_us: 10000        # 手眼采集时云台动得快会有运动模糊 → 可调小（如 3000）再采
  gain_db: 0
  framerate: 210
  pixel_format: "BayerRG8"  # 满帧率必须 8bit
  balance_white_auto: "Once"

#####-----棋盘格（打印板 11×8 方格、格距 30mm）-----#####
# pattern_* 是"内角点"数：11×8 个方格 → 10×7 个内角点（OpenCV patternSize 的语义）。
# 若你手上的板其实是 11×8 个内角点（即 12×9 个方格），这里改成 11 / 8。
# 自证方法：capture 画面叠加显示 board OK 即语义正确；全 failure 先怀疑这里。
pattern_cols: 10
pattern_rows: 7
center_distance_mm: 30

#####-----相机内参（2026-08-15 标定，rms 0.098px）-----#####
camera_matrix: [1292.4613, 0, 651.550, 0, 1292.1487, 485.413, 0, 0, 1]
distort_coeffs: [-0.0791303, 0.1741172, -0.0006693, 0.0000524, -0.1184516]

#####-----手眼-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]   # 云台→IMU 体轴；IMU 接入前单位阵

#####-----串口（下位机 io::Gimbal，协议见 docs/serial-protocol.md）-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200
first_q_timeout_s: 3      # 标定场景给 3s：下位机不在 3s 内报错退出（capture --no-q 可完全跳过）
