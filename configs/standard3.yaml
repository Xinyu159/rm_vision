enemy_color: "red"

#####-----相机（大恒 Galaxy MER-139-210U3C）-----#####
camera_name: "galaxy"
galaxy:
  sn: "KE0210030288"        # 留空则按 index 打开
  index: 1
  # 几何参数必须写全！相机设置会跨开关机保留（实测），不写会沿用上次遗留的 ROI
  roi_width: 1280           # 宽步进 16、高步进 2；-1 = 不改
  roi_height: 1024
  roi_x: 0
  roi_y: 0
  decimation: 1             # 1~2，抽行抽列；驱动放在 ROI 之后设置（改 ROI 会把抽行重置回 1）
  exposure_us: 10000        # 微秒。帧率上限 ≈ 1/曝光：要 210fps 需 ≤4760
  gain_db: 0                # 0~16
  framerate: 210            # 设定值；实际取 min(设定, 1/曝光, 带宽/帧大小)
  pixel_format: "BayerRG8"  # 满帧率必须 8bit（BayerRG10 按 2B/px 算会超 400MB/s）
  balance_white_auto: "Once"  # Off/Once/Continuous；单位增益画面偏青，开流后自动做一次白平衡
                              # （窗口预览里按 w 可随时重做；做颜色识别链路时再定固定 R/B 增益）

#####-----标定与解算（内外参均为 2026-10-11 手眼实拍标定）-----#####
# 内参：calibrate_camera 96 张识别 75、rms 0.123px（与 calibration.yaml 相机块同步）
camera_matrix: [1282.53324435994, 0, 647.4986327469708, 0, 1282.229787675208, 511.5407319264762, 0, 0, 1]
distort_coeffs: [-0.07386963879816996, 0.09753513916562999, 0.0001865833496305231, 0.0003022888766735818, 0.09264600795890895]
# 外参（对齐 sp_vision_25 solver 的同名顶层键；行主序，t 单位 m）：
# calibrate_robotworld_handeye 解出（新采段 46~96 重编号 1~51、取 40 帧；5 个子集 t 互差 ≈1.5cm）：
# 相机偏角 yaw -1.51 / pitch -1.16 / roll 0.43 degree（≈正装）；
# 相机在云台轴前方 11.8cm、下方 5.5cm（|t|=0.130m）；板在云台前方 1.61m
# 注意 R_camera2gimbal 不能用单位阵——那等于把相机系当世界系（光轴=z 轴），
# 欧拉角参数化会退化（目标在正前方时 yaw≡0），静默出错
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]   # 云台→IMU 体轴（IMU 接入后才有意义）
R_camera2gimbal: [0.02618882876806535, -0.02048261048983933, 0.9994471511367061, -0.9996292191904745, 0.006918895268432004, 0.02633539498291821, -0.007454487802578843, -0.9997662684626771, -0.02029381816749157]
t_camera2gimbal: [0.1178083526461107, 0.006257396839643945, -0.05483512557974111]
yaw_search_center: "auto"  # yaw 精搜索中心：auto（无 IMU→目标方位角；有 IMU→云台 yaw，带兜底）/ pnp / gimbal / bearing
armor_pitch_deg: 15        # 精搜索的 pitch 假设（规则装甲板倾角；桌面竖立打印板用 0）
outpost_pitch_deg: -15     # 前哨站

#####-----检测（0526 模型，TensorRT FP16；验证报告 docs/0526-model-verification.md）-----#####
yolo:
  engine_path: "models/0526_fp16.engine"  # trtexec 构建、设备绑定；程序相对仓库根运行
  min_confidence: 0.50   # objectness 阈值（实测验证值；同济常量 0.7 偏高会漏检）
  nms_threshold: 0.45    # 同济用 0.3
  # 有无大装甲板：今年规则没有大装甲板 → false，所有板按小处理（仅 Bb 例外），
  # 型别误判风险为零。练车/旧场地见大板时改 true，由关键点几何判大小
  has_big_armor: false
  # 大/小装甲判定阈值（仅 has_big_armor=true 时生效）：正视时
  # max(上下边)/两灯条平均长 ≈ 小 2.41 / 大 4.11，取中点。斜视（灯条差 Δh≥5px）
  # 先用与型别无关的 yaw 折算再比；Bs/Bb(编号 7/8) 由编号直接给出
  big_ratio_threshold: 3.3

#####-----串口（下位机，io::Gimbal；协议见 docs/serial-protocol.md）-----#####
com_port: "/dev/ttyACM0"   # 插拔后设备号可能变（ttyACM0/1）；可选 udev 建 /dev/gimbal 符号链接（同济做法）
baud_rate: 115200          # USB CDC ACM 下波特率被忽略；若电控经 USB-TTL 桥接则必须一致
first_q_timeout_s: 0       # 0 = 无限等首帧（对齐同济，上车用）；标定/测试场景给 3 避免下位机静默时挂死

