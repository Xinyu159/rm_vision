enemy_color: "red"

#####-----相机（大恒 Galaxy MER-139-210U3C）-----#####
camera_name: "galaxy"
galaxy:
  sn: "KE0210030288"        # 留空则按 index 打开
  index: 1
  # 几何参数必须写全！相机设置会跨开关机保留（实测），不写会沿用上次遗留的 ROI
  roi_width: 1280           # 宽步进 16、高步进 2；-1 = 不改
  roi_height: 1024
  roi_x: 0
  roi_y: 0
  decimation: 1             # 1~2，抽行抽列；驱动放在 ROI 之后设置（改 ROI 会把抽行重置回 1）
  exposure_us: 10000        # 微秒。帧率上限 ≈ 1/曝光：要 210fps 需 ≤4760
  gain_db: 0                # 0~16
  framerate: 210            # 设定值；实际取 min(设定, 1/曝光, 带宽/帧大小)
  pixel_format: "BayerRG8"  # 满帧率必须 8bit（BayerRG10 按 2B/px 算会超 400MB/s）
  balance_white_auto: "Once"  # Off/Once/Continuous；单位增益画面偏青，开流后自动做一次白平衡
                              # （窗口预览里按 w 可随时重做；做颜色识别链路时再定固定 R/B 增益）

#####-----标定与解算（内参 2026-08-15，台账见 calibration/；外参待手眼标定）-----#####
camera_matrix: [1292.4613, 0, 651.550, 0, 1292.1487, 485.413, 0, 0, 1]
distort_coeffs: [-0.0791303, 0.1741172, -0.0006693, 0.0000524, -0.1184516]
# 外参（对齐 sp_vision_25 solver 的同名顶层键；行主序，t 单位 m）：
# 当前是"相机理想正装"占位值（光轴水平朝前、无滚转、t=0），手眼标定后用真值覆盖；
# solver 检测到占位值会打启动告警。注意 R_camera2gimbal 不能用单位阵——那等于把
# 相机系当世界系（光轴=z 轴），欧拉角参数化会退化（目标在正前方时 yaw≡0），静默出错
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]   # 云台→IMU 体轴（IMU 接入后才有意义）
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]  # 此行即"相机正装"理论值（同济 mvs 配置同款）
t_camera2gimbal: [0, 0, 0]
yaw_search_center: "auto"  # yaw 精搜索中心：auto（无 IMU→目标方位角；有 IMU→云台 yaw，带兜底）/ pnp / gimbal / bearing
armor_pitch_deg: 15        # 精搜索的 pitch 假设（规则装甲板倾角；桌面竖立打印板用 0）
outpost_pitch_deg: -15     # 前哨站

#####-----检测（0526 模型，TensorRT FP16；验证报告 docs/0526-model-verification.md）-----#####
yolo:
  engine_path: "models/0526_fp16.engine"  # trtexec 构建、设备绑定；程序相对仓库根运行
  min_confidence: 0.50   # objectness 阈值（实测验证值；同济常量 0.7 偏高会漏检）
  nms_threshold: 0.45    # 同济用 0.3
  # 有无大装甲板：今年规则没有大装甲板 → false，所有板按小处理（仅 Bb 例外），
  # 型别误判风险为零。练车/旧场地见大板时改 true，由关键点几何判大小
  has_big_armor: false
  # 大/小装甲判定阈值（仅 has_big_armor=true 时生效）：正视时
  # max(上下边)/两灯条平均长 ≈ 小 2.41 / 大 4.11，取中点。斜视（灯条差 Δh≥5px）
  # 先用与型别无关的 yaw 折算再比；Bs/Bb(编号 7/8) 由编号直接给出
  big_ratio_threshold: 3.3

