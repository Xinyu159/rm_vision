enemy_color: "red"

#####-----相机（大恒 Galaxy MER-139-210U3C）-----#####
camera_name: "galaxy"
galaxy:
  sn: "KE0210030288"        # 留空则按 index 打开
  index: 1
  # 几何参数必须写全！相机设置会跨开关机保留（实测），不写会沿用上次遗留的 ROI
  roi_width: 1280           # 宽步进 16、高步进 2；-1 = 不改
  roi_height: 1024
  roi_x: 0
  roi_y: 0
  decimation: 1             # 1~2，抽行抽列；驱动放在 ROI 之后设置（改 ROI 会把抽行重置回 1）
  exposure_us: 10000        # 微秒。帧率上限 ≈ 1/曝光：要 210fps 需 ≤4760
  gain_db: 0                # 0~16
  framerate: 210            # 设定值；实际取 min(设定, 1/曝光, 带宽/帧大小)
  pixel_format: "BayerRG8"  # 满帧率必须 8bit（BayerRG10 按 2B/px 算会超 400MB/s）
  balance_white_auto: "Once"  # Off/Once/Continuous；单位增益画面偏青，开流后自动做一次白平衡
                              # （窗口预览里按 w 可随时重做；做颜色识别链路时再定固定 R/B 增益）

#####-----标定（2026-08-15 标定，台账见 calibration/）-----#####
camera_matrix: [1292.4613, 0, 651.550, 0, 1292.1487, 485.413, 0, 0, 1]
distort_coeffs: [-0.0791303, 0.1741172, -0.0006693, 0.0000524, -0.1184516]
# TODO: 手眼标定后补 R_gimbal2imubody / R_camera2gimbal / t_camera2gimbal

#####-----检测（0526 模型，TensorRT FP16；验证报告 docs/0526-model-verification.md）-----#####
yolo:
  engine_path: "models/0526_fp16.engine"  # trtexec 构建、设备绑定；程序相对仓库根运行
  min_confidence: 0.50   # objectness 阈值（实测验证值；同济常量 0.7 偏高会漏检）
  nms_threshold: 0.45    # 同济用 0.3
  big_ratio_threshold: 1.4  # 长/宽比 ≥ 此值判大装甲；Bs/Bb(编号 7/8) 由编号直接给出

